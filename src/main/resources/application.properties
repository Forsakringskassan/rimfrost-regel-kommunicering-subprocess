# Packaging
quarkus.package.jar.type=fast-jar

mp.messaging.incoming.kommunicering-responses.connector=smallrye-kafka
mp.messaging.incoming.kommunicering-responses.auto.offset.reset=earliest
mp.messaging.incoming.kommunicering-responses.group.id=${PROCESS_ID}-kommunicering-responses-consumer
mp.messaging.incoming.kommunicering-responses.topic=kommunicering-responses
mp.messaging.incoming.kommunicering-responses.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.outgoing.kommunicering-requests.connector=smallrye-kafka
mp.messaging.outgoing.kommunicering-requests.topic=kommunicering-requests
mp.messaging.outgoing.kommunicering-requests.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.kommunicering-oul-cancelled.connector=smallrye-kafka
mp.messaging.outgoing.kommunicering-oul-cancelled.topic=kommunicering-cancelled
mp.messaging.outgoing.kommunicering-oul-cancelled.value.serializer=org.apache.kafka.common.serialization.StringSerializer
